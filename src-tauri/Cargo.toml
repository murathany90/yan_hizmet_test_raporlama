[package]
name = "teias-yhda"
version = "0.6.4"
description = "TEİAŞ Yan Hizmetler Doğrulama Aracı"
authors = ["TEİAŞ-YHDA Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "teias_yhda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
