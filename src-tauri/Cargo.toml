[package]
name = "yda"
version = "0.7.0"
description = "YDA (Yan Hizmetler Doğrulama Aracı)"
authors = ["YDA Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
